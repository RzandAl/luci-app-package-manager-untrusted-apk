name: Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate standalone patch
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply and inspect patch
        run: |
          set -eu

          base_commit='067535eaf51a59582b775a8b588a9b05810f8030'
          patch_file="${GITHUB_WORKSPACE}/patches/luci-app-package-manager-untrusted-upload-067535e.patch"
          luci_tree="${RUNNER_TEMP}/luci"

          test "$(sha256sum "$patch_file" | awk '{ print $1 }')" = \
              '8cfbe3d45b11ea4688cbedb0af609584ce531180b61cc613f9400d8a8dbd9412'

          git init "$luci_tree"
          git -C "$luci_tree" remote add origin \
              https://github.com/openwrt/luci.git
          git -C "$luci_tree" fetch --depth=1 origin "$base_commit"
          git -C "$luci_tree" switch --detach FETCH_HEAD

          git -C "$luci_tree" apply --check "$patch_file"
          git -C "$luci_tree" apply --index "$patch_file"
          git -C "$luci_tree" diff --cached --check
          test "$(git -C "$luci_tree" write-tree)" = \
              '4840108cc406996d631b8c3fc8be42a0e15cf14b'

          package_root="${luci_tree}/applications/luci-app-package-manager"

          bash -n \
              "${package_root}/root/usr/libexec/package-manager-call"
          python3 -m json.tool \
              "${package_root}/root/usr/share/rpcd/acl.d/luci-app-package-manager.json" \
              >/dev/null
          node --check \
              "${package_root}/htdocs/luci-static/resources/view/package-manager.js"

          grep -Fxq '/etc/config/luci-package-manager' "${package_root}/Makefile"

          python3 - "$package_root" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          acl = json.loads((root / 'root/usr/share/rpcd/acl.d/luci-app-package-manager.json').read_text())
          permissions = acl['luci-app-package-manager']
          for access in ('read', 'write'):
              assert permissions[access]['uci'] == ['luci-package-manager'], access
          assert permissions['write']['ubus']['uci'] == ['commit', 'revert']
          config = (root / 'root/etc/config/luci-package-manager').read_text()
          assert config == "config package_manager 'main'\n\toption allow_untrusted_uploads '0'\n"
          backend = (root / 'root/usr/libexec/package-manager-call').read_text()
          assert '--allow-untrusted' in backend
          assert '--force-non-repository' not in backend
          assert 'luci-package-manager.main.allow_untrusted_uploads' in backend
          PY
